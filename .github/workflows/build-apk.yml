name: Build ARM64 Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build ARM64 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ALL-Launcher-arm64-debug-apk
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
